services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edutrack}
      POSTGRES_USER: ${POSTGRES_USER:-edutrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edutrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edutrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edutrack

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - edutrack

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-edutrack};Username=${POSTGRES_USER:-edutrack};Password=${POSTGRES_PASSWORD:-edutrack}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      Jwt__Issuer: ${JWT_ISSUER:-EduTrack}
      Jwt__Audience: ${JWT_AUDIENCE:-EduTrackClient}
      Cors__AllowedOrigins__0: ${APP_ORIGIN:-http://localhost:8080}
      Storage__ServiceUrl: http://rustfs:9000
      Storage__AccessKey: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      Storage__SecretKey: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
      Storage__BucketName: ${RUSTFS_BUCKET_NAME:-edutrack-uploads}
    networks:
      - edutrack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edutrack

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edutrack

networks:
  edutrack:

volumes:
  pgdata:
  rustfs-data:
